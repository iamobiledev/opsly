# Slack app manifest for Opsly.
# Create the app at https://api.slack.com/apps -> "Create New App" -> "From an app manifest",
# pick your workspace, and paste this file. Then see README.md -> "Slack setup".
display_information:
  name: Opsly
  description: Incident management & on-call rotations, right here in Slack
  background_color: "#1f2530"
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Opsly
    always_online: true
  slash_commands:
    - command: /incident
      description: Trigger and manage incidents
      usage_hint: "[list | 42 | ack 42 | resolve 42 | note 42 <text> | assign 42 @user]"
      should_escape: true
    - command: /oncall
      description: Who is on call right now
      should_escape: false
    - command: /opsly
      description: Opsly setup & admin (services, schedules, overrides, policies)
      usage_hint: "[status | services | schedules | override | policies | help]"
      should_escape: true
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - chat:write.public
      - users:read
      - users:read.email
      - im:write
      - channels:read
      - groups:read
settings:
  event_subscriptions:
    bot_events:
      - app_home_opened
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
